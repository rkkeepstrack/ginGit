name: release

# Tag v1.2.3 and this builds the macOS app (universal) and a Linux binary,
# then attaches both to a GitHub release for that tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  WAILS_VERSION: v2.16.0

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - run: wails build -platform darwin/universal -clean
      - run: ditto -c -k --keepParent build/bin/ginGit.app ginGit-${{ github.ref_name }}-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ginGit-*-macos-universal.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - run: wails build -platform linux/amd64 -tags webkit2_41 -clean
      - run: tar -C build/bin -czf ginGit-${{ github.ref_name }}-linux-amd64.tar.gz ginGit
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ginGit-*-linux-amd64.tar.gz

  publish:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ginGit-*-macos-universal.zip
            ginGit-*-linux-amd64.tar.gz
          generate_release_notes: true
